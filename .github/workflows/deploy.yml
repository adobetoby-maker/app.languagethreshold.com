name: Verify and deploy to Vercel

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify, test, and typecheck
        run: |
          npm run audit:prod
          npm run test
          npm run typecheck
          npm run lint

      - name: Verify production Vercel destination
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run verify:deploy-target
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel artifact
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://pollhlkgltdkdskdzsgd.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvbGxobGtnbHRka2Rza2R6c2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzkxMjYsImV4cCI6MjA5NDI1NTEyNn0.cLU4NaYrxCjrb4pFz483810rs33UASEcGP0U7tAA-8M"
          VITE_SUPABASE_PROJECT_ID: "pollhlkgltdkdskdzsgd"
          VITE_STRIPE_PRICE_MONTHLY: "price_1TbKk2QjohgWhWidZ7BQKWbL"
          VITE_STRIPE_PRICE_ANNUAL: "price_1TbKk4QjohgWhWid1m86409i"
          VITE_STRIPE_PRICE_FAMILY: "price_1TbKk5QjohgWhWidSuAbMeTq"

      - name: Verify Vercel artifact
        run: npm run verify:vercel-artifact

      # Vercel's Git integration deploys main to the verified project. A second
      # prebuilt CLI upload fails at Vercel's 10 MB request limit and is not
      # needed for production. IndexNow runs on Vercel's successful Production
      # deployment status in indexnow.yml, after the site is published.
